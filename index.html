<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>സ്കൂൾ ശാസ്ത്രോത്സവം Poster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@600;700;800&family=Poppins:wght@600;700;800&display=swap');
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:#1c2a44;
    font-family:'Poppins','Anek Malayalam',sans-serif;
    background:
      radial-gradient(circle at 10% 0%, rgba(40,180,140,.18), transparent 36%),
      radial-gradient(circle at 100% 8%, rgba(90,70,200,.1), transparent 40%),
      #f3f7f2;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 12px 48px;
  }
  .bar{width:100%; max-width:520px; height:6px; border-radius:4px; margin-bottom:12px;
    background:linear-gradient(90deg,#6a1b9a,#c62828 40%,#2e7d32);}
  h1{font-size:18px; font-weight:800; margin:0 0 4px; text-align:center; color:#1b5e20; font-family:'Anek Malayalam',sans-serif;}
  p.sub{margin:0 0 12px; text-align:center; color:#5c6b84; font-size:13px;}
  .stage{width:100%; max-width:460px; border-radius:16px; overflow:hidden;
    box-shadow:0 16px 36px rgba(20,40,30,.18); background:#fff;}
  .stage canvas{display:block; width:100%; height:auto;}
  .cards{width:100%; max-width:520px; margin-top:14px; display:flex; flex-direction:column; gap:12px;}
  .card{background:#fff; border-radius:16px; padding:14px 16px; border:1px solid #e3eadf;
    box-shadow:0 8px 18px rgba(20,40,30,.05); position:relative; overflow:hidden;}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,#6a1b9a,#2e7d32);}
  .card-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .num{width:24px; height:24px; border-radius:50%; color:#fff; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; background:#1b5e20;}
  .ttl{font-size:14.5px; font-weight:800; color:#1b5e20; font-family:'Anek Malayalam',sans-serif;}
  label{display:block; font-size:12px; color:#5c6b84; font-weight:700; margin-bottom:6px;}
  input[type="text"], select{
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid #e3eadf; background:#fbfefb;
    font-family:'Anek Malayalam','Poppins',sans-serif; font-weight:700; font-size:15px; outline:none; color:#1c2a44;
  }
  input:focus, select:focus{border-color:#2e7d32;}
  .btn{width:100%; padding:12px; border:none; border-radius:10px; font-weight:800; cursor:pointer; font-family:'Anek Malayalam',sans-serif;}
  .btn-photo{background:linear-gradient(135deg,#1b5e20,#2e7d32); color:#fff;}
  .btn-recrop{background:#eef6ee; color:#1b5e20; border:1.5px solid #c9e2c9; margin-top:8px;}
  .btn-reset{background:#fff; color:#8a3a3a; border:1.5px solid #f0c7c7; margin-top:8px;}
  .btn-recrop:disabled,.btn-reset:disabled{opacity:.4; cursor:not-allowed;}
  .photo-row{display:flex; gap:10px; align-items:center;}
  .thumb{width:72px; height:90px; border-radius:10px; border:2px dashed #c9d7c4; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:#f4f8f3; flex-shrink:0;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .hint{font-size:11.5px; color:#6d7890; margin-top:8px; line-height:1.45;}
  .btn-download{background:linear-gradient(135deg,#1b5e20,#0d3d14); color:#fff; font-size:15.5px; padding:15px;}
  #filePhoto,#fileLogo{display:none;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(10,16,32,.84); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal-card{background:#fff; border-radius:18px; padding:20px; width:100%; max-width:440px; text-align:center;}
  .modal-card h2{margin:0 0 6px; color:#1b5e20; font-size:16px; font-family:'Anek Malayalam',sans-serif;}
  .crop-wrap{margin:0 auto 12px; border-radius:14px; overflow:hidden; background:#eceff4; touch-action:none; cursor:grab;}
  .crop-wrap canvas{display:block; width:100%; height:auto;}
  .zoom-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .zoom-row input{flex:1; accent-color:#2e7d32;}
  .modal-actions{display:flex; gap:10px;}
  .btn-cancel{background:#f4eee6; color:#5a4630;}
</style>
</head>
<body>
  <div class="bar"></div>
  <h1>സ്കൂൾ ശാസ്ത്രോത്സവം</h1>
  <p class="sub">ഫോട്ടോ, ഇനം, ഗ്രേഡ്, കാറ്റഗറി, പേര്, സ്കൂൾ ചേർത്ത് പോസ്റ്റർ തയ്യാറാക്കൂ</p>
  <div class="stage"><canvas id="posterCanvas" width="1638" height="2048"></canvas></div>
  <div class="cards">
    <div class="card">
      <div class="card-head"><span class="num">1</span><span class="ttl">ലോഗോ</span></div>
      <div class="photo-row">
        <div class="thumb" id="logoThumb" style="width:64px;height:64px;border-radius:50%">🏫</div>
        <div style="flex:1">
          <button class="btn btn-photo" id="pickLogoBtn">ലോഗോ അപ്‌ലോഡ്</button>
          <button class="btn btn-reset" id="resetLogoBtn" disabled>↺ റീസെറ്റ്</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span class="num">2</span><span class="ttl">ഉപജില്ല</span></div>
      <label for="subInput">മലയാളം / English · സ്കൂൾ എന്നതിന് മുകളിൽ</label>
      <input type="text" id="subInput" maxlength="32" placeholder="മഞ്ചേരി ഉപജില്ല" autocomplete="off">
    </div>
    <div class="card">
      <div class="card-head"><span class="num">3</span><span class="ttl">ഇനം</span></div>
      <label for="itemInput">മലയാളം / English</label>
      <input type="text" id="itemInput" maxlength="28" placeholder="ഒറിഗാമി" autocomplete="off">
    </div>
    <div class="card">
      <div class="card-head"><span class="num">3</span><span class="ttl">ഫോട്ടോ</span></div>
      <div class="photo-row">
        <div class="thumb" id="photoThumb">📷</div>
        <div style="flex:1">
          <button class="btn btn-photo" id="pickPhotoBtn">ഫോട്ടോ അപ്‌ലോഡ് ചെയ്യുക</button>
          <button class="btn btn-recrop" id="recropPhotoBtn" disabled>✂️ ക്രോപ്പ്</button>
          <button class="btn btn-reset" id="resetPhotoBtn" disabled>↺ റീസെറ്റ്</button>
        </div>
      </div>
      <p class="hint">ഫ്രെയിമിന്റെ നാല് വശവും നിറയും.</p>
    </div>
    <div class="card">
      <div class="card-head"><span class="num">4</span><span class="ttl">Grade / Position</span></div>
      <label for="gradeInput">Select</label>
      <select id="gradeInput">
        <option value="">— Select —</option>
        <option value="1">First with A Grade</option>
        <option value="2">Second with A Grade</option>
        <option value="3">Third with A Grade</option>
      </select>
    </div>
    <div class="card">
      <div class="card-head"><span class="num">5</span><span class="ttl">Category</span></div>
      <label for="catInput">LP / UP / HS / HSS</label>
      <select id="catInput">
        <option value="">— Select —</option>
        <option>LP</option>
        <option>UP</option>
        <option>HS</option>
        <option>HSS</option>
      </select>
    </div>
    <div class="card">
      <div class="card-head"><span class="num">6</span><span class="ttl">പേര്</span></div>
      <label for="nameInput">English</label>
      <input type="text" id="nameInput" maxlength="32" placeholder="MUHAMMED MINHAJ P" autocomplete="off">
    </div>
    <div class="card">
      <div class="card-head"><span class="num">7</span><span class="ttl">സ്കൂൾ</span></div>
      <label for="schoolInput">മലയാളം / English</label>
      <input type="text" id="schoolInput" maxlength="42" placeholder="ജി.എച്ച്.എസ് സ്കൂൾ മൂന്നേക്കരാട്" autocomplete="off">
    </div>
    <button class="btn btn-download" id="downloadBtn">⬇ പോസ്റ്റർ ഡൗൺലോഡ്</button>
    <input type="file" id="filePhoto" accept="image/*">
    <input type="file" id="fileLogo" accept="image/*">
  </div>
  <div class="modal-backdrop" id="cropModal">
    <div class="modal-card">
      <h2>ഫോട്ടോ ക്രോപ്പ് ചെയ്യുക</h2>
      <p style="color:#5c6b84;font-size:12px;margin:0 0 12px">വലിച്ചു നീക്കാം, സൂം ചെയ്യാം. നാല് വശവും നിറയും.</p>
      <div class="crop-wrap" id="cropWrap"><canvas id="cropCanvas"></canvas></div>
      <div class="zoom-row"><span>➖</span><input type="range" id="zoomRange" min="100" max="350" value="100"><span>➕</span></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="cropCancelBtn">റദ്ദാക്കുക</button>
        <button class="btn btn-photo" id="cropConfirmBtn">✔ ശരി</button>
      </div>
    </div>
  </div>

  const PHOTO = { cx: 818, cy: 1136, w: 508, h: 700, radius: 36 };
  const LOGO  = { cx: 301, cy: 208, r: 168 };
  const SUB   = { x: 818, y: 158, maxW: 900, size: 69 };
  const ITEM  = { x: 818, y: 690, maxW: 720, size: 78 };
  const NAME  = { x: 818, y: 1528, maxW: 900, size: 46 };
  const SCHOOL= { x: 819, y: 1936, maxW: 1500, size: 114 };
  const CAT   = { x: 1273, y: 936, size: 64 };
  const BADGE = { x: 250, y: 1120, w: 300 };

  let photoPlacement = null, logoImg = null;

  function roundRectPath(c,x,y,w,h,r){
    const rr=Math.min(r,w/2,h/2);
    c.beginPath(); c.moveTo(x+rr,y);
    c.arcTo(x+w,y,x+w,y+h,rr); c.arcTo(x+w,y+h,x,y+h,rr);
    c.arcTo(x,y+h,x,y,rr); c.arcTo(x,y,x+w,y,rr); c.closePath();
  }
  function val(id){ return (document.getElementById(id).value || '').trim(); }
  function fitText(c, text, maxW, start, font){
    let s = start;
    c.font = '800 '+s+'px '+font;
    while(c.measureText(text).width > maxW && s > 18){
      s -= 1; c.font = '800 '+s+'px '+font;
    }
    return s;
  }
  function draw(){
    ctx.clearRect(0,0,CW,CH);
    if(templateImg.complete && templateImg.naturalWidth)
      ctx.drawImage(templateImg, 0, 0, CW, CH);
    else { ctx.fillStyle='#dff3e4'; ctx.fillRect(0,0,CW,CH); }

    if(logoImg){
      ctx.save();
      ctx.beginPath();
      ctx.arc(LOGO.cx, LOGO.cy, LOGO.r, 0, Math.PI*2);
      ctx.clip();
      const sc = Math.max((LOGO.r*2)/logoImg.width, (LOGO.r*2)/logoImg.height);
      const w = logoImg.width*sc, h = logoImg.height*sc;
      ctx.drawImage(logoImg, LOGO.cx-w/2, LOGO.cy-h/2, w, h);
      ctx.restore();
    }

    const sub = val('subInput');
    if(sub){
      ctx.save();
      ctx.fillStyle = '#0e6b5c';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      fitText(ctx, sub, SUB.maxW, SUB.size, '"Anek Malayalam","Poppins",sans-serif');
      ctx.fillText(sub, SUB.x, SUB.y);
      ctx.restore();
    }

    const item = val('itemInput');
    if(item){
      ctx.save();
      ctx.fillStyle = '#5b2d86';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      fitText(ctx, item, ITEM.maxW, ITEM.size, '"Anek Malayalam","Poppins",sans-serif');
      ctx.fillText(item, ITEM.x, ITEM.y);
      ctx.restore();
    }

    if(photoPlacement){
      ctx.save();
      roundRectPath(ctx, PHOTO.cx-PHOTO.w/2, PHOTO.cy-PHOTO.h/2, PHOTO.w, PHOTO.h, PHOTO.radius);
      ctx.clip();
      ctx.drawImage(
        photoPlacement.img,
        PHOTO.cx+photoPlacement.x - photoPlacement.w*0.02,
        PHOTO.cy+photoPlacement.y - photoPlacement.h*0.02,
        photoPlacement.w*1.04,
        photoPlacement.h*1.04
      );
      ctx.restore();
      ctx.save();
      roundRectPath(ctx, PHOTO.cx-PHOTO.w/2, PHOTO.cy-PHOTO.h/2, PHOTO.w, PHOTO.h, PHOTO.radius);
      ctx.strokeStyle = '#6a2a86';
      ctx.lineWidth = 10;
      ctx.stroke();
      ctx.restore();
    }

    const g = val('gradeInput');
    if(g){
      const b = badgeImgs[parseInt(g,10)-1];
      if(b && b.complete && b.naturalWidth){
        const bw = BADGE.w, bh = bw * (b.naturalHeight/b.naturalWidth);
        ctx.drawImage(b, BADGE.x - bw/2, BADGE.y - bh/2, bw, bh);
      }
    }

    const cat = val('catInput');
    if(cat){
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '800 '+CAT.size+'px Poppins,sans-serif';
      ctx.fillText(cat, CAT.x, CAT.y);
      ctx.restore();
    }

    const name = val('nameInput');
    if(name){
      ctx.save();
      ctx.fillStyle = '#2f6b28';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      fitText(ctx, name, NAME.maxW, NAME.size, '"Poppins",sans-serif');
      ctx.fillText(name, NAME.x, NAME.y);
      ctx.restore();
    }

    const school = val('schoolInput');
    if(school){
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,.25)';
      ctx.shadowBlur = 6;
      fitText(ctx, school, SCHOOL.maxW, SCHOOL.size, '"Anek Malayalam","Poppins",sans-serif');
      ctx.fillText(school, SCHOOL.x, SCHOOL.y);
      ctx.restore();
    }
  }

  templateImg.onload = draw;
  badgeImgs.forEach(b => b.onload = draw);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  document.getElementById('subInput').addEventListener('input', draw);
  document.getElementById('itemInput').addEventListener('input', draw);
  document.getElementById('schoolInput').addEventListener('input', draw);
  document.getElementById('gradeInput').addEventListener('change', draw);
  document.getElementById('catInput').addEventListener('change', draw);
  document.getElementById('nameInput').addEventListener('input', e => {
    const el=e.target, caret=el.selectionStart;
    el.value = el.value.replace(/[^A-Za-z .'\-]/g,'').toUpperCase();
    try{ el.setSelectionRange(caret,caret); }catch(err){}
    draw();
  });

  const cropModal=document.getElementById('cropModal');
  const cropCanvas=document.getElementById('cropCanvas');
  const cropCtx=cropCanvas.getContext('2d');
  const cropWrap=document.getElementById('cropWrap');
  const zoomRange=document.getElementById('zoomRange');
  let pendingImg=null, baseScale=1, zoom=1, panX=0, panY=0;
  let dragging=false, dsx=0, dsy=0, psx=0, psy=0;
  let PW=320, PH=414;

  function cur(){
    const sc=baseScale*zoom, w=pendingImg.width*sc, h=pendingImg.height*sc;
    return {x:PW/2-w/2+panX, y:PH/2-h/2+panY, w, h};
  }
  function clamp(){
    const sc=baseScale*zoom, w=pendingImg.width*sc, h=pendingImg.height*sc;
    const mx=Math.max(0,(w-PW)/2), my=Math.max(0,(h-PH)/2);
    panX=Math.min(mx,Math.max(-mx,panX)); panY=Math.min(my,Math.max(-my,panY));
  }
  function drawCrop(){
    cropCtx.clearRect(0,0,PW,PH);
    cropCtx.save();
    roundRectPath(cropCtx,0,0,PW,PH, 16);
    cropCtx.clip();
    cropCtx.fillStyle='#eceff4'; cropCtx.fillRect(0,0,PW,PH);
    if(pendingImg){ const d=cur(); cropCtx.drawImage(pendingImg,d.x,d.y,d.w,d.h); }
    cropCtx.restore();
  }
  function openCrop(img){
    pendingImg=img;
    PW=320; PH=Math.round(320*(PHOTO.h/PHOTO.w));
    cropCanvas.width=PW; cropCanvas.height=PH;
    baseScale=Math.max(PW/img.width, PH/img.height);
    zoom=1; panX=0; panY=0; zoomRange.value=100;
    drawCrop(); cropModal.classList.add('open');
  }
  cropWrap.addEventListener('pointerdown', e => {
    if(!pendingImg) return;
    dragging=true; cropWrap.setPointerCapture(e.pointerId);
    dsx=e.clientX; dsy=e.clientY; psx=panX; psy=panY;
  });
  cropWrap.addEventListener('pointermove', e => {
    if(!dragging) return;
    const rect=cropCanvas.getBoundingClientRect();
    panX=psx+(e.clientX-dsx)*(PW/rect.width);
    panY=psy+(e.clientY-dsy)*(PH/rect.height);
    clamp(); drawCrop();
  });
  cropWrap.addEventListener('pointerup', ()=>dragging=false);
  cropWrap.addEventListener('pointercancel', ()=>dragging=false);
  zoomRange.addEventListener('input', ()=>{ zoom=parseInt(zoomRange.value,10)/100; clamp(); drawCrop(); });
  document.getElementById('cropCancelBtn').onclick=()=>cropModal.classList.remove('open');
  document.getElementById('cropConfirmBtn').onclick=()=>{
    const d=cur(); const mapX=PHOTO.w/PW, mapY=PHOTO.h/PH;
    photoPlacement={ img:pendingImg, x:(d.x-PW/2)*mapX, y:(d.y-PH/2)*mapY, w:d.w*mapX, h:d.h*mapY };
    document.getElementById('recropPhotoBtn').disabled=false;
    document.getElementById('resetPhotoBtn').disabled=false;
    const thumb=document.getElementById('photoThumb'); thumb.innerHTML='';
    const im=document.createElement('img'); im.src=pendingImg.src; thumb.appendChild(im);
    cropModal.classList.remove('open'); draw();
  };

  const filePhoto=document.getElementById('filePhoto');
  document.getElementById('pickPhotoBtn').onclick=()=>filePhoto.click();
  filePhoto.addEventListener('change', e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=ev=>{ const img=new Image(); img.onload=()=>openCrop(img); img.src=ev.target.result; };
    r.readAsDataURL(file); filePhoto.value='';
  });
  document.getElementById('recropPhotoBtn').onclick=()=>{ if(photoPlacement) openCrop(photoPlacement.img); };
  document.getElementById('resetPhotoBtn').onclick=()=>{
    photoPlacement=null; document.getElementById('photoThumb').innerHTML='📷';
    document.getElementById('recropPhotoBtn').disabled=true;
    document.getElementById('resetPhotoBtn').disabled=true; draw();
  };

  const fileLogo=document.getElementById('fileLogo');
  document.getElementById('pickLogoBtn').onclick=()=>fileLogo.click();
  fileLogo.addEventListener('change', e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        logoImg=img;
        document.getElementById('resetLogoBtn').disabled=false;
        const thumb=document.getElementById('logoThumb'); thumb.innerHTML='';
        const im=document.createElement('img'); im.src=img.src; thumb.appendChild(im);
        draw();
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(file); fileLogo.value='';
  });
  document.getElementById('resetLogoBtn').onclick=()=>{
    logoImg=null; document.getElementById('logoThumb').innerHTML='🏫';
    document.getElementById('resetLogoBtn').disabled=true; draw();
  };

  document.getElementById('downloadBtn').onclick=()=>{
    draw();
    const nm=(val('nameInput')||'poster').replace(/\s+/g,'_');
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='sasthrolsavam-'+nm+'.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    },'image/jpeg',0.92);
  };
})();
</script>
</body>
</html>
